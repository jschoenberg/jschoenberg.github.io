title: "Jeremiah's Show(nberg)"
description: "Daily notes, ideas, and occasional ramblings."
url: "https://jschoenberg.github.io"
baseurl: ""

collections:
  daily:
    output: true
    permalink: /daily/:year/:month/:day/:title/
  ramblings:
    output: true
    permalink: /ramblings/:title/

defaults:
  - scope:
      path: ""
      type: "daily"
    values:
      layout: "post"
      section: "Daily"
  - scope:
      path: ""
      type: "ramblings"
    values:
      layout: "post"
      section: "Ramblings"
  - scope:
      path: "wall.md"
    values:
      layout: "page"
      section: "The Wall"

markdown: kramdown
timezone: America/Chicago
