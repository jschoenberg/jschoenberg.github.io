---
layout: default
---
<article class="post-content">
  <a class="back-link" href="{{ '/' | relative_url }}">&larr; Back home</a>
  <div class="eyebrow">{{ page.section }} &middot; {{ page.date | date: "%B %-d, %Y" }}</div>
  <h1>{{ page.title }}</h1>
  {% if page.intro %}<p class="post-intro">{{ page.intro }}</p>{% endif %}
  <div class="prose">{{ content }}</div>
</article>
