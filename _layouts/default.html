<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="wordmark" href="{{ '/' | relative_url }}"><span class="wordmark-mark">J</span><span>{{ site.title }}</span></a>
        <nav aria-label="Main navigation">
          <a href="{{ '/daily/' | relative_url }}">Daily</a>
          <a href="{{ '/board/' | relative_url }}">The Board</a>
          <a href="{{ '/ramblings/' | relative_url }}">Ramblings</a>
        </nav>
      </header>
      <main>{{ content }}</main>
      <footer class="site-footer"><span>Made for notes, links, and whatever comes next.</span><span class="footer-dot"></span><span>{{ "now" | date: "%Y" }}</span></footer>
    </div>
  </body>
</html>
